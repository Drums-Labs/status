name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/
      - name: Render an empty page (no history yet)
        run: node src/status.mjs render --history /nonexistent.jsonl --out "$RUNNER_TEMP/site" && test -s "$RUNNER_TEMP/site/index.html"
