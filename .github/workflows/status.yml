# Probe the Drums services every 5 minutes from GitHub's runners (outside our hosts, console and database), keep 7
# days of results on the `data` branch, and publish the page to GitHub Pages.
#
# History: branch `data` holds one file, history.jsonl, in a single orphan commit that every run replaces
# (force-push), so the repository does not grow by a commit every 5 minutes.
# Pages: the deploy job runs only when the repository variable PAGES_ENABLED is "true" (set it after turning Pages on
# with source "GitHub Actions"); until then the probe and the history still run and the page is kept as an artifact.
# Secret SUPABASE_ANON_KEY is optional (the public anon key; the REST probe works without it, answering 401).
# GitHub may delay or skip scheduled runs under load; a missing check shows as a gap, not as down.
name: status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Load history from the data branch
        run: |
          mkdir -p data
          if git fetch --quiet --depth=1 origin data; then
            git show FETCH_HEAD:history.jsonl > data/history.jsonl || : > data/history.jsonl
          else
            echo "no data branch yet; starting a new history"
            : > data/history.jsonl
          fi
      - name: Probe
        run: node src/status.mjs probe --history data/history.jsonl
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Save history (one orphan commit, force-pushed)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          blob=$(git hash-object -w data/history.jsonl)
          tree=$(printf '100644 blob %s\thistory.jsonl\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "status history $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          git push --quiet --force origin "$commit:refs/heads/data"
      - name: Render page
        run: node src/status.mjs render --history data/history.jsonl --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  deploy:
    needs: probe
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
